<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- ── SEO base (mis à jour dynamiquement par le composant SEO) ── -->
    <title>Valentin Bedague — Web Designer &amp; Développeur Full Stack</title>
    <meta name="description" content="Valentin Bedague — Web designer &amp; développeur full stack à Biarritz. Je crée des sites web iconiques, performants et qui convertissent." />
    <meta name="author" content="Valentin Bedague" />
    <meta name="robots" content="index, follow" />

    <!-- ── Open Graph (fallback statique) ────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Valentin Bedague" />
    <meta property="og:title"       content="Valentin Bedague — Web Designer &amp; Développeur Full Stack" />
    <meta property="og:description" content="Web designer &amp; développeur full stack à Biarritz. Sites iconiques, performants et qui convertissent." />
    <meta property="og:url"         content="https://valentinbedague.com/" />
    <meta property="og:image"       content="https://valentinbedague.com/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="fr_FR" />

    <!-- ── Twitter / X Card ──────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Valentin Bedague — Web Designer &amp; Développeur Full Stack" />
    <meta name="twitter:description" content="Web designer &amp; développeur full stack à Biarritz. Sites iconiques, performants et qui convertissent." />
    <meta name="twitter:image"       content="https://valentinbedague.com/og-image.png" />
    <meta name="twitter:creator"     content="@valentinbedague" />

    <!-- ── Canonical & hreflang ──────────────────────────────────── -->
    <link rel="canonical" href="https://valentinbedague.com/" />
    <link rel="alternate" hreflang="fr"        href="https://valentinbedague.com/" />
    <link rel="alternate" hreflang="en"        href="https://valentinbedague.com/" />
    <link rel="alternate" hreflang="x-default" href="https://valentinbedague.com/" />

    <!-- ── Google Fonts ──────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&family=IBM+Plex+Mono:wght@0,400;0,600&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&family=IBM+Plex+Mono:wght@0,400;0,600&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <!--
      Inline theme init — runs before first paint to avoid flash of wrong theme.
      Reads localStorage preference, falls back to system preference.
    -->
    <script>
      (function () {
        var s = localStorage.getItem('vb-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var isLight = s === 'light' || (!s && !prefersDark)
        if (isLight) document.body.classList.add('site-light')
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
